<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EdgeLedger is a trading journal that shows how your emotions, mistakes and rule breaks affect your P&L." />
    <meta name="theme-color" content="#0A0E1F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EdgeLedger: the trading journal that finds your leaks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      try {
        var s = JSON.parse(localStorage.getItem('edgeledger-theme') || 'null');
        var t = s && s.state && s.state.theme;
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
